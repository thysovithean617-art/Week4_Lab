<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
        }
        .box1 {
            width: 10em;
            height: 400px;
            background-color: rgb(225, 114, 208);
        }
        .box2 {
            width: 20em;
            height: 400px;
            background-color: grey;
        }
        .box3 {
            width: 10em;
            height: 400px;
            background-color: rgb(225, 114, 208);
        }
        .box2-1 {
            width: 20em;
            height: 100px;
        }
        .box2-2 {
            width: 20em;
            height: 1em;
            background-color: rgb(30, 235, 30);
        }
        .box2-3 {
            width: 20em;
            height: 10.5em;
        }
        .box2-4 {
            width: 20em;
            height: 1em;
            background-color: rgb(30, 235, 30);
        }
        .box2-5 {
            width: 20em;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2">
            <div class="box2-1">Header</div>
            <div class="box2-2"></div>
            <div class="box2-3">Main</div>
            <div class="box2-4"></div>
            <div class="box2-5">Footer</div>
        </div>
        <div class="box3"></div>
    </div>
</body>
</html>
